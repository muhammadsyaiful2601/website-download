[build]
  command = "node scripts/sync-releases.mjs"
  publish = "."

# Aset statis: jangan disimpan lama di cache CDN agar perubahan langsung terlihat.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/releases.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
