<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="800" fill="#f8fafc"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="800" fill="#1d4ed8"/>
  <circle cx="34" cy="34" r="16" fill="#93c5fd"/>
  <text x="34" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">PN</text>
  <text x="60" y="30" font-size="13" font-weight="700" fill="#ffffff">Sistem Peminjaman…</text>
  <text x="60" y="48" font-size="10.5" fill="#bfdbfe">POLITEKNIK NEGERI PADANG</text>
  <g fill="#dbeafe" font-size="12.5">
    <text x="50" y="120">Peminjaman</text>
    <text x="50" y="188">Scan Pengembalian</text>
  </g>
  <rect x="14" y="148" width="222" height="36" rx="10" fill="#ffffff"/>
  <text x="50" y="172" font-size="12.5" font-weight="600" fill="#1d4ed8">Buat Peminjaman</text>
  <text x="24" y="240" font-size="10.5" font-weight="700" fill="#93c5fd">DOKUMEN</text>
  <g fill="#dbeafe" font-size="12.5">
    <text x="50" y="268">Peminjaman Skala Besar</text>
    <text x="50" y="302">Bebas Labor</text>
    <text x="50" y="336">Laporan</text>
  </g>
  <text x="24" y="382" font-size="10.5" font-weight="700" fill="#93c5fd">MANAJEMEN</text>
  <g fill="#dbeafe" font-size="12.5">
    <text x="50" y="410">Data Mahasiswa</text>
    <text x="50" y="444">Data Tendik &amp; Dosen</text>
    <text x="50" y="478">Kelola User</text>
    <text x="50" y="512">Kelola Teknisi</text>
    <text x="50" y="546">Pengaturan Sistem</text>
  </g>
  <rect x="0" y="726" width="250" height="74" fill="#1e40af"/>
  <circle cx="34" cy="762" r="15" fill="#ffffff" opacity="0.2"/>
  <text x="34" y="767" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <text x="60" y="758" font-size="12.5" font-weight="600" fill="#ffffff">Admin Utama</text>
  <text x="60" y="775" font-size="11" fill="#bfdbfe">Petugas Utama</text>

  <!-- Konten -->
  <text x="292" y="60" font-size="13" fill="#2563eb">&#8592; &#160;Kembali ke Daftar Peminjaman</text>
  <text x="292" y="104" font-size="26" font-weight="700" fill="#0f172a">Form Peminjaman Barang Baru</text>
  <text x="292" y="134" font-size="13" fill="#64748b">Petugas mendaftarkan peminjaman &amp; mengirim QR Code via email peminjam.</text>

  <rect x="292" y="164" width="936" height="210" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="316" y="188" width="38" height="38" rx="10" fill="#eff6ff"/>
  <text x="335" y="213" text-anchor="middle" font-size="16" fill="#2563eb">&#9724;</text>
  <text x="366" y="214" font-size="16" font-weight="700" fill="#0f172a">1. Pilih Barang</text>
  <text x="316" y="262" font-size="11.5" font-weight="700" fill="#334155">BARANG 1</text>
  <text x="1000" y="262" font-size="11.5" font-weight="700" fill="#334155">JUMLAH</text>
  <rect x="316" y="272" width="660" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="336" y="300" font-size="13" fill="#94a3b8">Pilih barang...</text>
  <rect x="992" y="272" width="120" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1008" y="300" font-size="13" fill="#334155">1</text>
  <rect x="316" y="326" width="200" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="332" y="349" font-size="12.5" font-weight="600" fill="#2563eb">+ &#160;Tambah Barang lain</text>

  <rect x="292" y="396" width="936" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="316" y="420" width="38" height="38" rx="10" fill="#eff6ff"/>
  <text x="335" y="445" text-anchor="middle" font-size="16" fill="#2563eb">&#128100;</text>
  <text x="366" y="446" font-size="16" font-weight="700" fill="#0f172a">2. Data Peminjam</text>
  <text x="316" y="492" font-size="13" fill="#64748b">Tentukan jenis peminjam, lalu pilih data yang tersimpan untuk mengisi</text>
  <text x="316" y="514" font-size="13" fill="#64748b">otomatis atau isi manual. QR Code akan dikirim ke email yang dimasukkan.</text>
  <text x="316" y="548" font-size="11.5" font-weight="700" fill="#334155">JENIS PEMINJAM *</text>
  <rect x="316" y="558" width="888" height="42" rx="12" fill="#f1f5f9"/>
  <rect x="318" y="560" width="216" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="426" y="585" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb">Mahasiswa</text>
  <g font-size="12.5" fill="#64748b">
    <text x="655" y="585" text-anchor="middle">Tendik</text>
    <text x="876" y="585" text-anchor="middle">Dosen</text>
    <text x="1090" y="585" text-anchor="middle">Umum</text>
  </g>
  <rect x="316" y="616" width="888" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="336" y="644" font-size="13" font-weight="600" fill="#0f172a">&#127891; Gunakan data mahasiswa tersimpan</text>
  <rect x="336" y="654" width="848" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="356" y="682" font-size="13" fill="#94a3b8">Cari NIM atau nama...</text>

  <text x="760" y="762" text-anchor="middle" font-size="11" fill="#94a3b8">&#169; developed by Muhammad Syaiful</text>
</svg>